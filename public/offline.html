<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | EEL Messenger</title>
  <style>
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .logo-badge {
      width: 70px;
      height: 70px;
      background: #F59E0B;
      color: #0F172A;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 24px;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 22px;
      color: #FFFFFF;
      margin-bottom: 10px;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    button {
      background: #F59E0B;
      color: #0F172A;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">EEL</div>
    <h1>You are currently offline</h1>
    <p>Elite Express Logistics Liberia Messenger requires a network connection to send real-time dispatches. Please check your mobile data or Wi-Fi.</p>
    <button onclick="window.location.reload()">Try Reconnecting</button>
  </div>
</body>
</html>
